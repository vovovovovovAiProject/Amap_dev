<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的行程 - 智途无忧</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .trips-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 24px;
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .trip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .trip-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-normal);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }

        .trip-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .trip-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .trip-card-city {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .trip-card-days {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .trip-card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .trip-card-date {
            font-size: 13px;
            color: var(--text-light);
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🧭</span>
                <span class="logo-text">智途无忧</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">智能规划</a>
                <a href="trips.html" class="nav-link active">我的行程</a>
                <a href="#" class="nav-link">帮助</a>
            </nav>
        </header>

        <main class="main-content" style="display: block; overflow-y: auto;">
            <div class="trips-container">
                <a href="index.html" class="back-link">← 返回规划</a>
                <h1 class="page-title">我的行程</h1>
                
                <div id="tripGrid" class="trip-grid">
                    <!-- JS动态生成 -->
                    <div class="loading-spinner" style="margin: 40px auto;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js?v=2"></script>
    <script>
        async function deleteTrip(tripId, event) {
            event.preventDefault();
            event.stopPropagation();

            if (!confirm('确定要删除这个行程吗？')) {
                return;
            }

            try {
                await api.deleteTrip(tripId);
                // 删除成功，移除卡片
                const card = event.target.closest('.trip-card');
                card.remove();

                // 检查是否还有行程
                const grid = document.getElementById('tripGrid');
                if (grid.children.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h3>暂无行程</h3>
                            <p>您还没有规划任何行程，快去创建一个吧！</p>
                            <a href="index.html" class="generate-btn" style="width: fit-content; margin: 24px auto; text-decoration: none;">开始规划</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请重试');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('tripGrid');

            try {
                const trips = await api.listTrips();
                grid.innerHTML = '';

                if (!trips || trips.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <h3>暂无行程</h3>
                            <p>您还没有规划任何行程，快去创建一个吧！</p>
                            <a href="index.html" class="generate-btn" style="width: fit-content; margin: 24px auto; text-decoration: none;">开始规划</a>
                        </div>
                    `;
                    return;
                }

                trips.forEach(trip => {
                    const card = document.createElement('a');
                    card.href = `index.html?trip_id=${trip.id}`;
                    card.className = 'trip-card';
                    card.innerHTML = `
                        <div class="trip-card-header">
                            <span class="trip-card-city">${trip.city}</span>
                            <span class="trip-card-days">${trip.days}天</span>
                        </div>
                        <h3 class="trip-card-title">${trip.title}</h3>
                        <div class="trip-card-date">
                            <span>共 ${trip.trip_days ? trip.trip_days.reduce((sum, day) => sum + (day.items ? day.items.length : 0), 0) : 0} 个景点</span>
                            <button class="delete-btn" onclick="deleteTrip(${trip.id}, event)">删除</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Failed to load trips:', error);
                grid.innerHTML = '<div class="empty-state">加载失败，请稍后重试</div>';
            }
        });
    </script>
</body>
</html>
